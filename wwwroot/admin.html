<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Meridian Notification System</title>
  <link rel="stylesheet" href="/Scripts&Styles/adminStyle.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
  <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0f1a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #130d22;
      border-bottom: 1px solid #2d204e;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { font-size: 18px; font-weight: 700; color: #b794f4; }
    .role-badge {
      background: rgba(183,148,244,.1);
      border: 1px solid rgba(183,148,244,.3);
      color: #b794f4;
      padding: 4px 13px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    main { flex: 1; padding: 32px 24px; max-width: 720px; width: 100%; margin: 0 auto; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: #718096; margin-bottom: 24px; }
    .status-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 14px;
      border-radius: 8px;
      background: #130d22;
      border: 1px solid #2d204e;
      font-size: 13px;
      color: #718096;
      margin-bottom: 22px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #fc8181; flex-shrink: 0; transition: background .4s; }
    .dot.live { background: #68d391; box-shadow: 0 0 6px rgba(104,211,145,.5); }
    .panel {
      background: #141824;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .panel-title {
      font-size: 14px; font-weight: 600;
      color: #b794f4;
      padding-bottom: 14px;
      margin-bottom: 18px;
      border-bottom: 1px solid #2d3748;
    }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #a0aec0; margin-bottom: 6px; }
    input[type=text], textarea {
      width: 100%;
      background: #0a0f1a;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 11px 14px;
      color: #e2e8f0;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
    }
    input[type=text]:focus, textarea:focus { border-color: #b794f4; }
    textarea { min-height: 100px; resize: vertical; }
    .priority-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .p-opt { cursor: pointer; }
    .p-opt input { position: absolute; opacity: 0; width: 0; }
    .p-lbl {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 12px 8px;
      border: 2px solid #2d3748;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #718096;
      text-align: center;
      transition: all .2s;
      position: relative;
    }
    .p-opt.c-info  input:checked ~ .p-lbl { color: #63b3ed; border-color: #63b3ed; background: rgba(99,179,237,.07); }
    .p-opt.c-warn  input:checked ~ .p-lbl { color: #f6ad55; border-color: #f6ad55; background: rgba(246,173,85,.07); }
    .p-opt.c-crit  input:checked ~ .p-lbl { color: #fc8181; border-color: #fc8181; background: rgba(252,129,129,.07); }
    .send-btn {
      width: 100%;
      padding: 13px;
      background: #6b46c1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background .2s, transform .1s;
    }
    .send-btn:hover:not(:disabled) { background: #553c9a; }
    .send-btn:active:not(:disabled) { transform: scale(0.985); }
    .send-btn:disabled { background: #2d3748; color: #4a5568; cursor: not-allowed; }
    .log { background: #080c14; border: 1px solid #2d3748; border-radius: 10px; padding: 16px; }
    .log-title { font-size: 13px; font-weight: 600; color: #718096; margin-bottom: 10px; }
    #log-list { min-height: 80px; max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
    .log-entry {
      font-size: 12px;
      font-family: monospace;
      padding: 5px 9px;
      border-radius: 4px;
      border-left: 2px solid;
    }
    .log-ok  { color: #68d391; background: rgba(104,211,145,.05); border-color: #68d391; }
    .log-err { color: #fc8181; background: rgba(252,129,129,.05); border-color: #fc8181; }
    .log-ph  { color: #2d3748; font-size: 13px; font-style: italic; text-align: center; padding: 18px; }
  </style>
</head>
<body>

<header>
  <div class="brand">⚡ Meridian Admin Panel</div>
  <div class="role-badge">Administrator</div>
</header>

<main>
  <h1>Broadcast Notifications</h1>
  <p class="subtitle">Send company-wide announcements to all connected employees in real time.</p>

  <div class="status-row">
    <div class="dot" id="adot"></div>
    <span id="astatus">Connecting to notification hub...</span>
  </div>

  <div class="panel">
    <div class="panel-title">Compose Notification</div>

    <div class="field">
      <label for="ntitle">Notification Title</label>
      <input type="text" id="ntitle" placeholder="e.g., System Maintenance Tonight" maxlength="120">
    </div>

    <div class="field">
      <label for="nmsg">Message Body</label>
      <textarea id="nmsg" placeholder="Full announcement text..." maxlength="500"></textarea>
    </div>

    <div class="field">
      <label>Priority Level</label>
      <div class="priority-grid">
        <label class="p-opt c-info">
          <input type="radio" name="pri" value="Info" checked>
          <div class="p-lbl">ℹ️ Info</div>
        </label>
        <label class="p-opt c-warn">
          <input type="radio" name="pri" value="Warning">
          <div class="p-lbl">⚠️ Warning</div>
        </label>
        <label class="p-opt c-crit">
          <input type="radio" name="pri" value="Critical">
          <div class="p-lbl">🚨 Critical</div>
        </label>
      </div>
    </div>

    <button id="send" class="send-btn" disabled>Send to All Employees</button>
  </div>

  <div class="log">
    <div class="log-title">Send Log</div>
    <div id="log-list"><div class="log-ph">Sent notifications will be logged here</div></div>
  </div>
</main>

<script>

// ADMIN PANEL — SignalR Client Logic

// Same connection setup as the employee dashboard.
// Both pages connect to the SAME Hub at the SAME URL.
const connection = new signalR.HubConnectionBuilder()       
    .withUrl("/notificationHub")
    .withAutomaticReconnect()
    .configureLogging(signalR.LogLevel.Information)
    .build();

// When connected, reveal our session info and enable the Send button.
connection.on("WelcomeMessage", function(connectionId) {   
    setStat(`Connected — Admin Session: ${connectionId.substring(0,16)}...`, true);
    document.getElementById("send").disabled = false;             
});

// Handle reconnecting — disable Send button while reconnecting
connection.onreconnecting(() => {
    setStat("Reconnecting...", false);
    document.getElementById("send").disabled = true;
});

// Reconnected — re-enable Send button
connection.onreconnected(() => {
    setStat("Reconnected", true);
    document.getElementById("send").disabled = false;
});

// ═══════ THE SEND BUTTON ════════════════════════════════════════
// This is where invoke() is called — triggering the Hub method.
document.getElementById("send").addEventListener("click", async function() { 

    const title    = document.getElementById("ntitle").value.trim();     
    const message  = document.getElementById("nmsg").value.trim();  
    const priority = document.querySelector('input[name="pri"]:checked').value;

    if (!title || !message) {                                
        addLog("❌ Title and Message cannot be empty.", false);
        return;
    }

    const btn = document.getElementById("send");
    btn.disabled = true;                                 
    btn.textContent = "Sending...";

    try {
        // THIS IS THE KEY LINE — calling the Hub method from JavaScript
        await connection.invoke("SendNotification", title, message, priority);  

        addLog(`✓ [${priority}] "${title}" sent at ${new Date().toLocaleTimeString()}`, true); 

        // Clear the form after successful send
        document.getElementById("ntitle").value = "";
        document.getElementById("nmsg").value = "";

    } catch (err) {                                        
        addLog(`❌ Send failed: ${err.message}`, false);
        console.error("invoke error:", err);

    } finally {                                               
        btn.disabled = false;
        btn.textContent = "Send to All Employees";
    }
});

function setStat(text, live) {
    document.getElementById("astatus").textContent = text;
    document.getElementById("adot").classList.toggle("live", live);
}

function addLog(text, ok) {
    const list = document.getElementById("log-list");
    const ph = list.querySelector(".log-ph");
    if (ph) ph.remove();
    const el = document.createElement("div");
    el.className = "log-entry " + (ok ? "log-ok" : "log-err");
    el.textContent = text;
    list.insertBefore(el, list.firstChild);
}

// Start connection with manual retry for initial failures
async function start() {
    try {
        await connection.start();
    } catch (e) {
        setStat("Connection failed — retrying in 5s...", false);
        setTimeout(start, 5000);
    }
}
start();
</script>
</body>
</html>
