<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meridian Technologies — Live Notifications</title>
  <link rel="stylesheet" href="employeeStyle.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>

  <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1a1f2e;
      border-bottom: 1px solid #2d3748;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand { font-size: 18px; font-weight: 700; color: #63b3ed; letter-spacing: -.01em; }
    .header-right { display: flex; align-items: center; gap: 20px; }
    .user-count { font-size: 13px; color: #718096; }
    .user-count span { color: #63b3ed; font-weight: 600; }
    .conn-status { display: flex; align-items: center; gap: 7px; font-size: 13px; }
    .conn-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #fc8181;
      transition: background 0.4s ease;
    }
    .conn-dot.live { background: #68d391; box-shadow: 0 0 6px rgba(104,211,145,0.5); }
    .conn-text { color: #a0aec0; }
    main { flex: 1; padding: 28px 24px; max-width: 820px; width: 100%; margin: 0 auto; }
    .page-title { font-size: 26px; font-weight: 700; color: #e2e8f0; margin-bottom: 4px; }
    .page-sub { font-size: 14px; color: #718096; margin-bottom: 22px; }
    .session-bar {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      font-family: monospace;
      color: #718096;
      margin-bottom: 22px;
    }
    .session-bar span { color: #63b3ed; }
    #feed { display: flex; flex-direction: column; gap: 12px; }
    .empty-state { text-align: center; padding: 70px 20px; color: #4a5568; }
    .empty-state .icon { font-size: 52px; margin-bottom: 14px; }
    .empty-state p { font-size: 15px; }
    .notif-card {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-left: 4px solid #4a5568;
      border-radius: 10px;
      padding: 16px 18px;
      animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .notif-card.p-info     { border-left-color: #63b3ed; }
    .notif-card.p-warning  { border-left-color: #f6ad55; }
    .notif-card.p-critical { border-left-color: #fc8181; background: #1f1522; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .card-title { font-size: 16px; font-weight: 600; color: #e2e8f0; }
    .badge {
      font-size: 11px; font-weight: 700;
      padding: 2px 9px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: .06em;
      flex-shrink: 0; margin-left: 10px;
    }
    .badge-info     { background: rgba(99,179,237,.15); color: #63b3ed; }
    .badge-warning  { background: rgba(246,173,85,.15);  color: #f6ad55; }
    .badge-critical { background: rgba(252,129,129,.15); color: #fc8181; }
    .card-body { font-size: 14.5px; color: #a0aec0; line-height: 1.65; }
    .card-foot {
      margin-top: 10px; font-size: 12px; color: #4a5568;
      display: flex; justify-content: space-between;
    }
    .sys-msg {
      background: #131820;
      border: 1px dashed #2d3748;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13px;
      color: #4a5568;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">🔔 Meridian Technologies</div>
  <div class="header-right">
    <div class="user-count"><span id="count">0</span> connected</div>
    <div class="conn-status">
      <div class="conn-dot" id="dot"></div>
      <span class="conn-text" id="conn-text">Connecting...</span>
    </div>
  </div>
</header>

<main>
  <h1 class="page-title">Live Notification Feed</h1>
  <p class="page-sub">Company announcements appear here instantly. No refresh needed.</p>
  <div class="session-bar">Your session: <span id="my-id">establishing connection...</span></div>
  <div id="feed">
    <div class="empty-state" id="empty">
      <div class="icon">📭</div>
      <p>Waiting for announcements. When an admin sends one, it will appear here instantly.</p>
    </div>
  </div>
</main>

<script> 

// EMPLOYEE DASHBOARD — SignalR Client Logic

// Track how many users are currently connected (estimated client-side count)
let connectedCount = 0;                                

// STEP A: BUILD THE HUB CONNECTION

const connection = new signalR.HubConnectionBuilder()  
    .withUrl("/notificationHub")                         
    .withAutomaticReconnect()                                  
    .configureLogging(signalR.LogLevel.Information)         
    .build();                                               

// STEP B: REGISTER ALL HANDLERS BEFORE start() 
// CRITICAL: Always register handlers before calling connection.start().
// Any message that arrives during the window between start() resolving
// and a handler being registered will be silently lost.
// Register first. Start second. No exceptions.

// Handler: Server confirms our connection and tells us our connection ID
connection.on("WelcomeMessage", function(connectionId, serverTime) { 
    document.getElementById("my-id").textContent = connectionId;      
    connectedCount++;                                        
    refreshCount();                                             
    const localTime = new Date(serverTime).toLocaleTimeString();   
    addSysMsg(`✓ Connected to Meridian Live Feed at ${localTime}`);  
});

// Handler: Another user connected — increment our displayed count
connection.on("UserConnected", function(connectionId) {     
    connectedCount++;
    refreshCount();
});

// Handler: A user disconnected — decrement count (never below 0)
connection.on("UserDisconnected", function(connectionId) {      
    connectedCount = Math.max(0, connectedCount - 1);              
    refreshCount();
});

// Handler: An admin broadcast a notification — this is the main event!
connection.on("ReceiveNotification", function(notification) {   
    removeEmptyState();                                     
    const card = buildCard(notification);                        
    const feed = document.getElementById("feed");
    feed.insertBefore(card, feed.firstChild);                

    if (notification.priority.toLowerCase() === "critical") {  
        flashTitle("🚨 URGENT: " + notification.title);
    }
});

// Reconnection lifecycle — update UI to show reconnecting state
connection.onreconnecting(function(error) {          
    setStatus("Reconnecting...", false);
});

// Reconnection succeeded — restore UI and log the event
connection.onreconnected(function(newConnectionId) {        
    setStatus("Connected", true);
    addSysMsg("Reconnected after network interruption.");
    // IMPORTANT: newConnectionId is different from the original!
    // Update the display if we're showing it:
    document.getElementById("my-id").textContent = newConnectionId + " (reconnected)";
});

// Connection permanently closed (after exhausting reconnect retries)
connection.onclose(function(error) {                        
    setStatus("Disconnected", false);
    addSysMsg("Connection closed. Refresh the page to reconnect.");
});

//STEP C: START THE CONNECTION

async function startConnection() {                             
    try {
        await connection.start();            
        setStatus("Connected", true);
    } catch (err) {
        console.error("SignalR connection error:", err);              
        setStatus("Connection Failed — Retrying in 5s", false);
        setTimeout(startConnection, 5000);                      
    }
}

startConnection();                                    

//STEP D: HELPER FUNCTIONS 

function setStatus(text, isLive) {                              
    document.getElementById("conn-text").textContent = text;
    document.getElementById("dot").classList.toggle("live", isLive);
}

function refreshCount() {                                     
    document.getElementById("count").textContent = connectedCount;
}

function removeEmptyState() {                     
    const el = document.getElementById("empty");
    if (el) el.remove();
}

function addSysMsg(text) {                                   
    const feed = document.getElementById("feed");
    const el = document.createElement("div");
    el.className = "sys-msg";
    el.textContent = text;
    feed.insertBefore(el, feed.firstChild);
    const emptyState = document.getElementById("empty");
    if (emptyState) emptyState.remove();
}

function buildCard(notification) {                  
    const p = (notification.priority || "info").toLowerCase();
    const t = new Date(notification.timestamp).toLocaleTimeString();
    const card = document.createElement("div");
    card.className = `notif-card p-${p}`;
    card.innerHTML = `
      <div class="card-top">
        <div class="card-title">${esc(notification.title)}</div>
        <span class="badge badge-${p}">${p}</span>
      </div>
      <div class="card-body">${esc(notification.message)}</div>
      <div class="card-foot">
        <span>Received: ${t}</span>
        <span>ID: ${notification.id.substring(0,8)}...</span>
      </div>`;
    return card;
}

function esc(text) {                         
    const d = document.createElement("div");
    d.appendChild(document.createTextNode(text));
    return d.innerHTML;
}

let _flashTimer;
function flashTitle(alertText) {                
    const orig = document.title;
    let toggle = false;
    clearInterval(_flashTimer);
    _flashTimer = setInterval(() => {
        document.title = toggle ? orig : alertText;
        toggle = !toggle;
    }, 750);
    setTimeout(() => { clearInterval(_flashTimer); document.title = orig; }, 12000);
}

</script>
</body>
</html>
