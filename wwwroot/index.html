<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meridian Technologies — Live Notifications</title>
  <link rel="stylesheet" href="/css/index.css">

</head>
<body>

<header>
  <div class="brand">Meridian Technologies</div>
  <div class="header-right">
    <div class="user-count"><span id="count">0</span> connected</div>
    <div class="conn-status">
      <div class="conn-dot" id="dot"></div>
      <span class="conn-text" id="conn-text">Connecting...</span>
    </div>
  </div>
</header>

<main>
  <h1 class="page-title">Live Notification Feed</h1>
  <p class="page-sub">Company announcements appear here instantly. No refresh needed.</p>
  <div class="session-bar">Your session: <span id="my-id">establishing connection...</span></div>
  <div id="feed">
    <div class="empty-state" id="empty">
      <div class="icon"></div>
      <p>Waiting for announcements. When an admin sends one, it will appear here instantly.</p>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<script src="/js/index.js"></script>

</body>
</html>
